<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>🌍 openworld · 分镜出片工厂</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2129; --border: #30363d;
    --text: #e6edf3; --dim: #8b949e; --acc: #58a6ff; --ok: #3fb950; --err: #f85149; --warn: #d29922;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; align-items: center; gap: 14px; padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { font-size: 18px; font-weight: 700; }
  header h1 span { color: var(--acc); }
  .status { margin-left: auto; font-size: 12px; padding: 4px 12px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--border); }
  .status.running { color: var(--warn); border-color: var(--warn); }
  .status.done { color: var(--ok); border-color: var(--ok); }
  .status.error { color: var(--err); border-color: var(--err); }
  main { flex: 1; display: flex; min-height: 0; }
  .left { width: 420px; flex-shrink: 0; border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .right { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .sec { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .sec h2 { font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
  textarea { width: 100%; height: 220px; background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-family: Consolas, monospace; font-size: 13px; line-height: 1.7; resize: vertical; }
  textarea:focus { outline: none; border-color: var(--acc); }
  .btn { background: var(--acc); color: #fff; border: none; border-radius: 8px; padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn:hover { filter: brightness(1.15); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.ghost { background: var(--panel2); border: 1px solid var(--border); color: var(--text); font-weight: 400; font-size: 12px; padding: 5px 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--panel2); border: 1px solid var(--border); border-radius: 14px; padding: 4px 12px; font-size: 12px; cursor: pointer; transition: 0.15s; }
  .chip:hover { border-color: var(--acc); color: var(--acc); }
  .chip small { color: var(--dim); margin-left: 4px; }
  .scene-card { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin-bottom: 6px; cursor: pointer; font-size: 13px; }
  .scene-card:hover { border-color: var(--acc); }
  .scene-card small { display: block; color: var(--dim); margin-top: 2px; }
  #log { flex: 1; overflow-y: auto; padding: 12px 16px; font-family: Consolas, monospace; font-size: 12px; line-height: 1.8; min-height: 120px; max-height: 34vh; }
  #log .err { color: var(--err); }
  #log .ok { color: var(--ok); }
  .progress { height: 4px; background: var(--panel2); }
  .progress i { display: block; height: 100%; background: var(--acc); transition: width 0.4s; }
  #wall { flex: 1; overflow-y: auto; padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; align-content: start; }
  .card-out { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .card-out video, .card-out img { width: 100%; display: block; background: #000; }
  .card-out .cap { padding: 8px 12px; font-size: 12px; color: var(--dim); display: flex; justify-content: space-between; }
  .card-out .cap b { color: var(--text); }
  .empty { color: var(--dim); text-align: center; padding: 60px 0; grid-column: 1/-1; }
  .examples { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
</style>
</head>
<body>
<header>
  <h1>🌍 open<span style="color:var(--acc)">world</span></h1>
  <span style="color:var(--dim);font-size:12px">分镜脚本 → AI 建造 → 自动出片</span>
  <span class="status" id="status">空闲</span>
</header>
<main>
  <div class="left">
    <div class="sec">
      <h2>📝 分镜脚本</h2>
      <textarea id="script" spellcheck="false"># 城堡宣传片
建造 城堡@65,90 房屋@76,88 望塔@83,103 树@70,84 树@80,96
分镜:
远景
正门
环绕 8秒
推近 5秒
俯瞰</textarea>
      <div class="examples">
        <button class="btn ghost" onclick="loadExample(0)">🏰 城堡宣传片</button>
        <button class="btn ghost" onclick="loadExample(1)">🏡 村庄日常</button>
        <button class="btn ghost" onclick="loadExample(2)">⚡ 快速出片（无建造）</button>
      </div>
      <div style="margin-top:12px;display:flex;gap:8px;align-items:center">
        <button class="btn" id="render" onclick="render()">🎬 开拍</button>
        <span style="font-size:12px;color:var(--dim)" id="hint"></span>
      </div>
    </div>
    <div class="sec" style="flex:1;overflow-y:auto">
      <h2>📦 素材库 <small style="text-transform:none">（点击插入脚本）</small></h2>
      <div id="assets"></div>
    </div>
  </div>
  <div class="right">
    <div class="progress"><i id="pbar" style="width:0"></i></div>
    <div id="log"><span style="color:var(--dim)">等待任务…</span></div>
    <div id="wall"><div class="empty">产出会显示在这里</div></div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const EXAMPLES = [
`# 城堡宣传片
建造 城堡@65,90 房屋@76,88 望塔@83,103 树@70,84 树@80,96
分镜:
远景
正门
环绕 8秒
推近 5秒
俯瞰`,
`# 村庄日常
建造 城堡@65,90 房屋@76,88 房屋@90,96 望塔@83,103 树@70,84 树@95,85
分镜:
远景
街道
庭院
环绕 10秒
塔`,
`# 快速出片（不建造，直接拍出生点区域）
分镜:
远景
环绕 6秒
俯瞰`
];
function loadExample(i) { $('script').value = EXAMPLES[i]; }

async function loadAssets() {
  try {
    const a = await (await fetch('/api/assets')).json();
    let html = '';
    html += '<div style="font-size:12px;color:var(--dim);margin:6px 0">建筑蓝图</div><div class="chips">';
    for (const b of a.blueprints) html += `<span class="chip" onclick="insert('${b.name} ')">${b.name}<small>${b.size || ''}</small></span>`;
    html += '</div>';
    if (a.scenes.length) {
      html += '<div style="font-size:12px;color:var(--dim);margin:10px 0 6px">已存场景</div>';
      for (const s of a.scenes) {
        html += `<div class="scene-card" onclick="insertScene('${s.name}')">🎬 ${s.name}<small>${s.build.length} 个建筑 · ${s.shots.length} 个分镜</small></div>`;
      }
    }
    $('assets').innerHTML = html;
  } catch (e) { $('assets').innerHTML = '<span style="color:var(--dim)">素材库加载失败</span>'; }
}
function insert(name) {
  const ta = $('script');
  const line = ta.value.match(/^建造.*$/m);
  const add = name;
  if (line) {
    ta.value = ta.value.replace(/^建造.*$/m, line[0] + ' ' + add);
  } else {
    ta.value = '建造 ' + add + '\n' + ta.value;
  }
}
function insertScene(name) {
  $('script').value = '场景 ' + name + '\n' + $('script').value.replace(/^场景.*\n?/m, '');
}

async function render() {
  $('render').disabled = true;
  try {
    const r = await (await fetch('/api/render', { method: 'POST', body: $('script').value })).json();
    if (r.error) { $('hint').textContent = r.error; $('render').disabled = false; return; }
    $('hint').textContent = '';
    poll();
  } catch (e) { $('hint').textContent = '提交失败: ' + e.message; $('render').disabled = false; }
}

let lastLogLen = -1, lastOutputs = -1;
async function poll() {
  try {
    const j = await (await fetch('/api/status')).json();
    const st = $('status');
    st.textContent = j.status === 'idle' ? '空闲' : j.status === 'running' ? '拍摄中 ' + (j.progress || 0) + '%' : j.status === 'done' ? '完成 ✅' : j.status === 'error' ? '失败 ✗' : '排队中';
    st.className = 'status ' + (j.status || '');
    $('pbar').style.width = (j.progress || 0) + '%';
    if (j.log && j.log.length !== lastLogLen) {
      lastLogLen = j.log.length;
      $('log').innerHTML = j.log.map(l => {
        const cls = l.includes('❌') ? 'err' : l.includes('✅') ? 'ok' : '';
        return `<div class="${cls}">${l}</div>`;
      }).join('');
      $('log').scrollTop = 1e6;
    }
    if (j.outputs && j.outputs.length !== lastOutputs) {
      lastOutputs = j.outputs.length;
      $('wall').innerHTML = j.outputs.map(o =>
        o.video
          ? `<div class="card-out"><video src="${o.url}" controls loop muted></video><div class="cap"><b>${o.shot}</b><span>${o.type}</span></div></div>`
          : `<div class="card-out"><img src="${o.url}"><div class="cap"><b>${o.shot}</b><span>${o.type}</span></div></div>`
      ).join('');
    }
    const busy = j.status === 'running' || j.status === 'queued';
    $('render').disabled = busy;
    if (busy || lastLogLen === -1) setTimeout(poll, 1500);
  } catch (e) { setTimeout(poll, 3000); }
}
loadAssets();
poll();
</script>
</body>
</html>
